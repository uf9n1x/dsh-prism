# Prism bundle patch — the GLOBAL layer.
#
# One self-contained package: every row below resolves inside this package, so
# the bundle installs from a single directory. Preset declarations live in
# `presets/*.patch.yml` (listed in package.json `dsh.bundle.patch`), because a
# preset is a row whose `plugins` list is the agent composition.
#
# What this row does NOT do: register tools. Tool surface belongs to the agent
# presets, so an ordinary coding/standard/PPT session never sees a prism_* tool.

- insert:
    - id: prism-host
      name: 'dsh-prism'
